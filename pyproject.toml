# SofreDoc Validator — configuración de calidad (raíz del monorepo)

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
# Permite importar `src.*` corriendo pytest desde la raíz (los tests viven en backend/)
pythonpath = ["backend"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
