# Verificación de calidad (MOD-05 T-11): un job con la batería completa.
# El deploy de cierre NO es automático (SPEC-05 §5): es manual/scriptado.
name: Verificación

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------- backend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias backend
        run: pip install -r backend/requirements.txt

      - name: Pytest con gate de cobertura (dominio 100%, total ≥ 95%)
        working-directory: backend
        run: python -m pytest tests -q --cov=src --cov-report=term-missing --cov-fail-under=95

      - name: Ruff (lint + formato)
        run: |
          ruff check backend
          ruff format --check backend

      # --------------------------------------------------------------- frontend
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            package-lock.json
      - name: Build de producción (frontend)
        working-directory: frontend
        run: npm ci && npm run build

      # ------------------------------------------------------------------- e2e
      # El `webServer` de playwright.config.ts levanta backend (mock, BD
      # efímera) + frontend Vite. En CI `reuseExistingServer` es false.
      - name: Instalar Playwright + Chromium
        run: npm ci && npx playwright install --with-deps chromium
      - name: E2E Playwright (4 escenarios, retries 0)
        run: npx playwright test qa/e2e/auditoria.spec.ts
        env:
          CI: "true"
      - name: Subir reporte E2E como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: qa/artifacts/playwright-report/
          retention-days: 7

      # ------------------------------------------------------------------- k6
      # RN-5-01: carga EXCLUSIVAMENTE con EXTRACTOR_MODE=mock (smoke de 10 VUs).
      - name: Instalar k6
        run: |
          curl -s https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb ubuntu main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -q && sudo apt-get install -qy k6
      - name: Levantar backend mock (BD efímera)
        working-directory: backend
        run: |
          node ../qa/e2e/reset-db.mjs
          DB_PATH=qa/artifacts/k6-ci.db EXTRACTOR_MODE=mock nohup python -m uvicorn src.main:app --port 8000 > ../qa/artifacts/uvicorn-k6.log 2>&1 &
          curl --retry 15 --retry-connrefused --retry-delay 1 -sf http://localhost:8000/api/v1/health > /dev/null
      - name: k6 smoke (10 VUs × 30 s)
        run: SMOKE=1 k6 run qa/load/stress_test.js
